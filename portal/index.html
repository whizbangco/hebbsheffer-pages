<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{metaTitle}}</title>
    <link rel="icon" id="favicon" href="{{linkFavicon}}" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <meta name="description" content="{{metaDescription}}" />
    <meta name="author" content="inReach Labs, Inc." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" crossorigin src="/portal/inreach-assets/index.1b0a589b.js"></script>
    <link rel="modulepreload" href="/portal/inreach-assets/vendor.087d8946.js">
    <link rel="stylesheet" href="/portal/inreach-assets/index.5e2889d3.css">
  </head>
  <body>
    <div id="app" >
      <svg id="index-loader-circular">
        <circle id="index-loader-path" cx="50" cy="50" r="20" fill="none" stroke-width="2" stroke-miterlimit="10"/>
      </svg>
    </div>
    
  </body>
</html>

<style>
body {
    background-color: #eee;
}
    
#index-loader-circular {
    animation: index-loader-rotate 2s linear infinite;
    height: 100px;
    width: 100px;
    /* center it on the screen */
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(1.2);   
}

#index-loader-path {
    stroke-dasharray: 1,200;
    stroke-dashoffset: 0;
    animation: 
    index-loader-dash 1.5s ease-in-out infinite,
    index-loader-color 6s ease-in-out infinite
    ;
    stroke-linecap: round;
}

@keyframes index-loader-rotate{
    100%{
    transform: index-loader-rotate(360deg);
    }
}
@keyframes index-loader-dash{
    0%{
    stroke-dasharray: 1,200;
    stroke-dashoffset: 0;
    }
    50%{
    stroke-dasharray: 89,200;
    stroke-dashoffset: -35;
    }
    100%{
    stroke-dasharray: 89,200;
    stroke-dashoffset: -124;
    }
}
@keyframes index-loader-color{
    100%, 0%{
    stroke: #d62d20;
    }
    40%{
    stroke: #0057e7;
    }
    66%{
    stroke: #008744;
    }
    80%, 90%{
    stroke: #ffa700;
    }
}  
</style>
